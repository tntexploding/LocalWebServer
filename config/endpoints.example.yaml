version: 1

httpServers:
  - id: local-http
    enabled: false
    host: 127.0.0.1
    port: 4789
    path: /ingest
    description: Local example HTTP listener.

wsServers:
  - id: control
    enabled: false
    host: 127.0.0.1
    port: 4789
    path: /ws/control
    description: Local example WebSocket listener.

httpClients:
  - id: local-http-client
    enabled: false
    baseUrl: http://127.0.0.1:8765
    description: Example outbound HTTP integration.
    test:
      probePath: /health
      sendMethod: POST
      sendPath: /v1/messages
wsClients:
  - id: local-ws-client
    enabled: false
    url: ws://127.0.0.1:8765/ws
    description: Persistent outbound WebSocket connection example.
    reconnect:
      enabled: true
      initialDelayMs: 1000
      maxDelayMs: 30000
      backoffMultiplier: 2
    heartbeatIntervalMs: 30000
